<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS prompt=input</title>
</head>
<body>
    <script>
        window.onload = function() {
        var namn=prompt("Vad är ditt namn: ");
        document.write("Hej "+ namn);
        }
    </script>
</body>
</html>
