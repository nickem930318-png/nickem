<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Jämförelseoperatorer i JavaScript</title>
</head>
<body>
<script type="text/javascript">
document.write("<table border='1'>");
var a = 1;
while (a <= 10)
{
document.write("<tr><td>");
document.write("Cell ", a );
document.write("</td></tr>");
a++;
}
document.write("</table>");
    </script>
</body>
</html>
