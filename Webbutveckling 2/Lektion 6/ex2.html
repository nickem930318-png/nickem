<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Jämförelseoperatorer i JavaScript</title>
</head>
<body>
    <script type="text/javascript">
      // Visar ett meddelande med dubbla citattecken runt JavaScript
alert("Välkommen till \"JavaScript\" ");

// Visar ett meddelande med enkelcitat runt JavaScript
alert("Välkommen till \'JavaScript\' ");

// Visar ett meddelande med en radbrytning
alert("Ett meddelande \n på två rader");

// Visar ett meddelande med en radbrytning och ett tabbavstånd
alert("Rad 1 \t Tabavstånd \nRad 2 \t Tabavstånd");

// Visar ett meddelande med en backslash
alert("Detta är Backslash \\ ");

    </script>
</body>
</html>
