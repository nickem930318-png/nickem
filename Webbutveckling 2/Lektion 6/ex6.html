<!DOCTYPE html>
<html lang="en">
<head>
     <title>Frågeapplikation</title>
    <!--<link rel="stylesheet" href="style.css">-->
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
}

#question-container {
    max-width: 400px;
    margin: 100px auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

#question {
    font-size: 20px;
    margin-bottom: 20px;
}

input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    padding: 10px 20px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

    </style>
</head>
<body>
    <div id="question-container">
        <h1 id="question">Vad heter huvudstaden i Sverige?</h1>
        <input type="text" id="answer">
        <button id="submit-answer">Svara</button>
    </div>

    <script src="script1.js"></script>
</body>
</html>
